name: azeoo_profile_sdk
description: "SDK Flutter pour l'affichage de profil utilisateur AZEOO"
version: 1.0.0+1
homepage: https://github.com/azeoo/azeoo_profile_sdk

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.5.0

  # Network
  dio: ^5.7.0

  # Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Serialization / Immutability
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional Programming (Error Handling)
  dartz: ^0.10.1

  # Image Caching
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  module:
    androidX: true
    androidPackage: com.azeoo.azeoo_profile_sdk
    iosBundleIdentifier: com.azeoo.azeooProfileSdk
